[project]
name = "concierge"
version = "0.1.0"
description = "Production-grade customer support agent: LangGraph workflow, hybrid RAG on Postgres, human approval for money-moving actions, evals in CI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-core>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langfuse>=4.16.0",
    "psycopg[binary,pool]>=3.3.6",
    "fastembed>=0.9.1",
    "structlog>=26.1",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[project.scripts]
concierge-ingest = "concierge.retrieval.ingest:main"
concierge-mcp = "concierge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a Postgres database with pgvector (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"evals/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
