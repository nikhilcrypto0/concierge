[project]
name = "concierge"
version = "0.1.0"
description = "Production-grade customer support agent: LangGraph workflow, hybrid RAG on Postgres, human approval for money-moving actions, evals in CI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-core>=1.6.3",
    "langchain-anthropic>=1.7.2",
    "langchain>=1.0",
    "langfuse>=4.15",
    "psycopg[binary,pool]>=3.3.5",
    "fastembed>=0.8.0",
    "structlog>=26.1",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
]

[project.scripts]
concierge-ingest = "concierge.retrieval.ingest:main"
concierge-mcp = "concierge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a Postgres database with pgvector (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"evals/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
